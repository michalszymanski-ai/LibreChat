# Re-encrypts stored credentials from the old CREDS_KEY/CREDS_IV to new ones (see rotate.js).
# Scale LibreChat to 0 first so no request decrypts with the wrong pair, then:
#
#   kubectl create configmap billechat-creds-rotation-script -n billechat \
#     --from-file=deploy/azure/credentials/ --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f deploy/azure/credentials/job.yaml   # DRY_RUN=true first, then false
#
# Secret `billechat-creds-rotation` holds OLD_/NEW_ CREDS_KEY and CREDS_IV. The JWT secrets
# come from the LibreChat Secret so the key-drift marker covers all four credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: billechat-creds-rotation
  namespace: billechat
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: rotate
          image: billechatacr.azurecr.io/billechat:735e14c
          command: ["node", "/opt/rotate/rotate.js"]
          env:
            - name: NODE_PATH
              value: /app/node_modules
            - name: DRY_RUN
              value: "true"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: billechat-librechat-configenv
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: billechat-librechat-env
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: billechat-librechat-env
                  key: JWT_REFRESH_SECRET
          envFrom:
            - secretRef:
                name: billechat-creds-rotation
          volumeMounts:
            - name: script
              mountPath: /opt/rotate
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: billechat-creds-rotation-script
